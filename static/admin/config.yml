backend:
  name: github
  repo: rcapitao/rcapitao-vhugo
  branch: main
  # Só o botão "Sign in using access token" aparece — sem app OAuth pra manter
  # (o site é 100% estático, sem servidor pra fazer o handshake do OAuth).
  auth_methods: [token]

# Sem editorial_workflow: existe só um botão "Salvar", que grava direto na
# branch main, sem passar por PR/board de revisão. Quem controla se o post
# vai pro ar é o campo "Salvar sem publicar (rascunho)", primeiro campo de
# cada formulário: marcado, o hugo.yml builda mas o Hugo não gera a página
# (fica só salvo, pra editar depois); desmarcado, o post aparece no site
# assim que o build terminar.

slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"

media_folder: static/images/posts
public_folder: /images/posts

collections:
  # Página inicial (rcapitao.com): bio link com os cartões de links.
  # Edita content/_index.md; o visual fica em layouts/index.html,
  # layouts/partials/biolink/ e assets/biolink/. Para um ícone novo, salve o
  # SVG em assets/biolink/icons/ e acrescente o nome nas opções abaixo.
  - name: home
    label: "Página inicial (bio link)"
    format: toml-frontmatter
    frontmatter_delimiter: "+++"
    files:
      - name: biolink
        label: "Página inicial (bio link)"
        file: content/_index.md
        fields:
          - { name: title, widget: hidden, default: "Rafael Capitão" }
          - { name: profileImage, widget: hidden, default: "/images/profile.jpg" }
          - { name: ogImage, widget: hidden, default: "/images/og-home.png" }

          # --- Perfil ---------------------------------------------------------
          - { label: Nome, name: name, widget: string }
          - { label: Subtítulo, name: subtitle, widget: string, hint: "Aparece abaixo do nome." }
          - label: Redes sociais
            name: socials
            widget: list
            summary: "{{fields.name}}"
            hint: "Botões redondos abaixo do subtítulo, na ordem da lista."
            fields:
              - { label: Nome, name: name, widget: string, hint: "Lido por leitores de tela e mostrado ao passar o mouse." }
              - { label: Endereço, name: url, widget: string }
              - { label: Ícone, name: icon, widget: select, options: [{ label: "Globo (site, blog)", value: globe }, { label: "Envelope (e-mail)", value: envelope }, { label: "Ferramentas", value: screwdriver-wrench }, { label: "Sino (novidades)", value: bell }, { label: "LinkedIn", value: linkedin }, { label: "Instagram", value: instagram }, { label: "Mastodon", value: mastodon }, { label: "Bluesky", value: bluesky }, { label: "X (Twitter)", value: x-twitter }, { label: "GitHub", value: github }] }

          # --- Destaque -------------------------------------------------------
          - label: Destaque
            name: featured
            widget: object
            required: false
            hint: "Cartão grande logo abaixo do perfil."
            fields:
              - { label: Link, name: href, widget: string }
              - { label: Imagem, name: image, widget: image, required: false, hint: "Proporção 4:1 (ex.: 1200×300)." }
              - { label: Descrição da imagem, name: imageAlt, widget: string, required: false, hint: "Para leitores de tela." }
              - { label: Rótulo, name: eyebrow, widget: string, required: false, hint: "Texto pequeno acima do título, ex.: Newsletter." }
              - { label: Título, name: title, widget: string }
              - { label: Descrição, name: description, widget: text, required: false }
              - { label: Texto do botão, name: button, widget: string, required: false }

          # --- Links ----------------------------------------------------------
          - label: Grupos de links
            name: groups
            widget: list
            summary: "{{fields.title}}"
            hint: "Cada grupo tem um título (ex.: Conteúdo, Fale comigo) e seus cartões."
            fields:
              - { label: Título do grupo, name: title, widget: string }
              - label: Cartões
                name: links
                widget: list
                summary: "{{fields.title}}"
                fields:
                  - { label: "Último post (automático)", name: latest, widget: boolean, required: false, default: false, hint: "Marcado, este cartão mostra sozinho o post mais recente do blog e os campos abaixo são ignorados." }
                  - { label: Título, name: title, widget: string, required: false }
                  - { label: Descrição, name: description, widget: string, required: false }
                  - { label: Link, name: href, widget: string, required: false, hint: "Página do site (ex.: /posts/), endereço completo (https://...) ou mailto:email@..." }
                  - { label: Ícone, name: icon, widget: select, options: [{ label: "Globo (site, blog)", value: globe }, { label: "Envelope (e-mail)", value: envelope }, { label: "Ferramentas", value: screwdriver-wrench }, { label: "Sino (novidades)", value: bell }, { label: "Pessoa (sobre)", value: user }, { label: "Bússola (diretório)", value: compass }, { label: "LinkedIn", value: linkedin }, { label: "Instagram", value: instagram }, { label: "Mastodon", value: mastodon }, { label: "Bluesky", value: bluesky }, { label: "X (Twitter)", value: x-twitter }, { label: "GitHub", value: github }], required: false, hint: "Se ficar vazio, usa o globo." }

  - name: posts
    label: Publicações
    label_singular: Publicação
    folder: content/posts
    create: true
    delete: true
    slug: "{{slug}}"
    format: toml-frontmatter
    frontmatter_delimiter: "+++"
    fields:
      # --- Publicação ---------------------------------------------------
      - &f_draft { label: "Salvar sem publicar (rascunho)", name: draft, widget: boolean, required: false, default: false, hint: "Marque e clique em Salvar para gravar sem publicar — continua editável quando quiser. Desmarque (padrão) e clique em Salvar para publicar direto no site." }

      # --- Essencial ---------------------------------------------------
      - { label: Título, name: title, widget: string }
      - { label: Data, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ssZ", output_utc: true }
      - { label: Descrição, name: description, widget: text }
      - { label: Etiquetas, name: tags, widget: tags-select, tag_options: ["Citações", "Dicas", "Filmes", "Governança de Privacidade", "Guias", "Inteligência Artificial", "LGPD", "Livros", "Privacidade", "Privacy Rocks", "Produtividade", "Reflexão", "Segurança da Informação", "Sharenting"] }
      - { label: Série, name: series, widget: string, required: false, hint: "Agrupa posts relacionados numa sequência numerada. Use o mesmo valor em 2 ou mais posts para ativar a navegação de série entre eles." }

      # --- Sumário -------------------------------------------------------
      - &f_showtoc { label: "Sumário — ativado (ShowToc)", name: ShowToc, widget: boolean, required: false, default: false, hint: "Gera automaticamente uma lista com os títulos (##, ###...) dentro de um bloco recolhível." }
      - &f_tocopen { label: "Sumário — já aberto (TocOpen)", name: TocOpen, widget: boolean, required: false, default: false, hint: "Só tem efeito com o Sumário (acima) ativado." }

      # --- Histórico -------------------------------------------------------
      - &f_showlastmod { label: "Exibir \"Última atualização\"", name: showLastmod, widget: boolean, required: false, default: false, hint: "Mostra a data da última atualização (pelo histórico do Git) abaixo do título, no site." }

      # --- SEO e descoberta ------------------------------------------------
      - &f_noindex { label: "SEO — remover dos mecanismos de busca", name: noindex, widget: boolean, required: false, default: false, hint: "Continua no site normalmente, só sai do Google/Bing etc." }
      - &f_searchhidden { label: "SEO — remover da busca interna do site", name: searchHidden, widget: boolean, required: false, default: false, hint: "Continua indexável pelo Google/Bing normalmente." }
      - &f_hidden { label: "SEO — remover do /llms.txt", name: hidden, widget: boolean, required: false, default: false, hint: "Continua no site e nas buscas normalmente." }

      # --- URLs -------------------------------------------------------------
      - &f_aliases { label: "URLs antigas (aliases)", name: aliases, widget: list, required: false, hint: "Redireciona URLs antigas para esta página — uma URL por linha, ex: /url-antiga/" }

      - { label: Corpo, name: body, widget: markdown }

  - name: pages
    label: Páginas
    label_singular: Página
    folder: content
    create: true
    delete: true
    slug: "{{slug}}"
    format: toml-frontmatter
    frontmatter_delimiter: "+++"
    # Coleção "files" não suporta excluir entradas no Sveltia (delete só
    # existe pra coleções "folder"). Por isso content/*.md virou uma
    # coleção "folder", filtrada por este campo escondido para pegar só as
    # páginas pensadas pra serem editadas por aqui — sem isso, /buscar/,
    # /feed/, /privacidade/ e /style-guide/ também apareceriam (e ficariam
    # expostas a exclusão sem querer).
    filter:
      field: cms_page
      value: true
    fields:
      - *f_draft
      - { name: cms_page, widget: hidden, default: true }
      - { label: Título, name: title, widget: string }
      - { label: Data, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ssZ", output_utc: true, required: false }
      - { label: Descrição, name: description, widget: text }
      - *f_showtoc
      - *f_tocopen
      - *f_showlastmod
      - *f_noindex
      - *f_searchhidden
      - *f_hidden
      - *f_aliases
      - { label: Corpo, name: body, widget: markdown }

  - name: privacy_rocks_pages
    label: "Privacy Rocks"
    label_singular: Página
    format: toml-frontmatter
    frontmatter_delimiter: "+++"
    # _index.md fica em "files" (sem exclusão): é a página da seção
    # /privacy-rocks/ — apagá-la quebraria a seção inteira.
    files:
      - name: privacy_rocks
        label: Privacy Rocks
        file: content/privacy-rocks/_index.md
        fields:
          - *f_draft
          - { label: Título, name: title, widget: string }
          - { label: Data, name: date, widget: datetime, format: "YYYY-MM-DD HH:mm:ssZ", output_utc: true, required: false }
          - { label: Descrição, name: description, widget: text }
          - *f_showtoc
          - *f_tocopen
          - *f_showlastmod
          - *f_noindex
          - *f_searchhidden
          - *f_hidden
          - *f_aliases
          - { label: Corpo, name: body, widget: markdown }
