baseURL = 'https://rcapitao.com/'
defaultContentLanguage = 'pt-br'
title = 'Rafael Capitão'

enableRobotsTXT = true
removePathAccents = true
enableGitInfo = true

[module]
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = 'archetypes'
    target = 'archetypes'
  [[module.mounts]]
    source = 'static/images'
    target = 'assets/images'
  [[module.mounts]]
    source = 'static/icon'
    target = 'assets/icon'

[outputFormats.rss]
  baseName = 'feed'

[outputFormats.llmstxt]
  mediaType = 'text/plain'
  baseName = 'llms'
  isPlainText = true

[markup.goldmark.renderer]
  unsafe = true

[params]
  description = 'Rafael Capitão, advogado especializado em compliance, privacidade e proteção de dados (LGPD). Artigos sobre segurança da informação e privacidade digital.'
  author = 'Rafael Capitão'
  homeTitle = 'Rafael Capitão'
  homeMetaTitle = 'Rafael Capitão | Advogado de Privacidade e Proteção de Dados'
  homeImage = '/images/profile.jpg'
  ogImage = '/images/profile.jpg'
  favicon = '/images/favicon.png'
  homeSubtitle = 'Advogado | Compliance, Privacidade e Proteção de Dados'
  homeBio = 'Regulamentação e melhores práticas para a segurança da informação e a privacidade no ambiente digital'
  recentPostsCount = 5

  [[params.socialLinks]]
    name = 'LinkedIn'
    url = 'https://linkedin.com/in/rafaelcapitao/'
    external = true
  [[params.socialLinks]]
    name = 'Instagram'
    url = 'https://instagram.com/rafael.capitao/'
    external = true
  [[params.socialLinks]]
    name = 'Mastodon'
    url = 'https://mastodon.social/@rcapitao'
    external = true
  [[params.socialLinks]]
    name = 'X'
    url = 'https://x.com/rafaelcapitao'
    external = true
  [[params.socialLinks]]
    name = 'Bluesky'
    url = 'https://bsky.app/profile/rcapitao.com'
    external = true
  [[params.socialLinks]]
    name = 'Threads'
    url = 'https://threads.com/@rafael.capitao'
    external = true
  [[params.socialLinks]]
    name = 'Github'
    url = 'https://github.com/rcapitao'
    external = true

  [[params.homeExplore]]
    label = 'Blog'
    url = '/posts/'
  [[params.homeExplore]]
    label = 'Tags'
    url = '/tags/'
  [[params.homeExplore]]
    label = 'Diretório'
    url = '/diretorio/'
  [[params.homeExplore]]
    label = 'Links'
    url = '/links/'

[menu]
  [[menu.main]]
    name = 'Sobre'
    url = '/sobre/'
    weight = 1
  [[menu.main]]
    name = 'Blog'
    url = '/posts/'
    weight = 2
  [[menu.main]]
    name = 'Diretório'
    url = '/diretorio/'
    weight = 3

[outputs]
  home = ['HTML', 'RSS', 'JSON', 'llmstxt']
  section = ['HTML']

[related]
  includeNewer = true
  threshold = 80
  toLower = true
  [[related.indices]]
    name = 'tags'
    weight = 100
  [[related.indices]]
    name = 'date'
    weight = 10

[minify]
  disableXML = true
